{% extends "base.html" %}
{% block title %}Iniciar Sesion - Refugio Huellitas{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h1>Iniciar Sesion</h1>
    <p style="color: #444444; text-align: center;">Ingresa tus credenciales para iniciar sesion.</p>

    <div class="form-contenedor">
        {% if error_message %}
        <div class="error">
            <p style="color: red;">{{ error }}</p>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'inicioSesion' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Nombre de Usuario:</label>
                <input type="text" name="nombre" required placeholder="Ingresa tu nombre de usuario">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" name="contraseña" required placeholder="Ingresa tu contraseña">
            </div>

            <button type="submit">Iniciar Sesion</button>
    </div>
</div>
{% endblock %}
