{% extends 'base.html' %}
{% block title %}Editar Especie - Refugio Huellitas{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h1>Editar Especie</h1>

    <a href="{% url 'panelGestion' %}">Volver a panel de Gestion</a>
    
    <div class="form-container">
        <form method="POST" action="{% url 'confirmarCambioEspecie'%}">
            {% csrf_token %}

            <input type="hidden" name="codigo" value="{{ especie.codigo }}">

            <label for="nombre">Nombre de la Especie:</label>
            <input type="text" name="nombre" value="{{ especie.nombre }}" required><br>

            <label for="descripcion">Descripción:</label>
            <input type="text" name="descripcion" value="{{ especie.descripcion }}" required><br>

            <button type="submit">Guardar Cambios</button>
            <a href="{% url 'panelGestion' %}" class="cancelar-button">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
