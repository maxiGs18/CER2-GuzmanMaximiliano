{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Refugio Huellitas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <header class="nav">
        <div class="contenedor nav-interior">
            <a class="logo" href="{% url 'home' %}">🐾 Refugio Huellitas</a>
            <nav class="menu">
                <a href="{% url 'home' %}">Inicio</a>
                <a href="{% url 'mascotas' %}">Mascotas</a>

                {% if user.is_authenticated %}
                    <a href="{% url 'panelGestion' %}">Panel de Gestion</a>
                    <a href="{% url 'logout' %}">Cerrar Sesion</a>
                {% else %}
                    <a href="{% url 'inicioSesion' %}">Iniciar Sesion</a>
                {% endif %}

            </nav>
        </div>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
